# Builds the Origin Bazar Android app on GitHub's free servers.
# Result: a ready-to-install .apk (and an .aab for Google Play) under
#   GitHub → Actions → "Build Android APK" → latest run → Artifacts
# Pushing a tag like v1.0.1 also publishes the APK on the Releases page.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Load signing key
        env:
          OB_KEYSTORE_BASE64: ${{ secrets.OB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OB_KEYSTORE_BASE64" ]; then
            echo "$OB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/originbazar-upload.jks"
            echo "OB_KEYSTORE_PATH=$RUNNER_TEMP/originbazar-upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the Origin Bazar release key."
          else
            echo "::warning::OB_KEYSTORE_BASE64 secret not set - APK is signed with a temporary debug key. Add the secrets before sharing the app."
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          OB_KEYSTORE_PASSWORD: ${{ secrets.OB_KEYSTORE_PASSWORD }}
          OB_KEY_ALIAS: ${{ secrets.OB_KEY_ALIAS }}
          OB_KEY_PASSWORD: ${{ secrets.OB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name the files
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OriginBazar-v${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/OriginBazar-v${VERSION}.aab"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OriginBazar-APK
          path: dist/*.apk

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: OriginBazar-AAB-PlayStore
          path: dist/*.aab

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
