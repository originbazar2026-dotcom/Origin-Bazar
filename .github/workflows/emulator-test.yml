# Opens the app on real Android emulators and saves crash logs to the "ci-logs" branch.
name: Test on Android emulator

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npm ci

      - run: npx expo prebuild --clean --platform android --no-install

      - name: Build release APK for emulator (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh ${{ matrix.api }} android/app/build/outputs/apk/release/app-release.apk

      - name: Report result
        if: always()
        run: |
          R=$(cat ci-logs/api-${{ matrix.api }}/result.txt 2>/dev/null || echo "NO RESULT")
          echo "::notice::API ${{ matrix.api }}: $R"
          if [ -s ci-logs/api-${{ matrix.api }}/crash.txt ]; then
            head -c 3000 ci-logs/api-${{ matrix.api }}/crash.txt | tr '\n' ' ' | sed 's/^/::error::CRASH /'
            echo
          fi

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          API=${{ matrix.api }}
          SRC="$GITHUB_WORKSPACE/ci-logs/api-$API"
          [ -d "$SRC" ] || SRC="/tmp/ci-logs/api-$API"
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git fetch --depth 20 origin ci-logs:refs/remotes/origin/ci-logs
          git worktree add -B ci-logs /tmp/logs origin/ci-logs
          cd /tmp/logs
          rm -rf "api-$API" && mkdir -p "api-$API"
          [ -d "$SRC" ] && cp -r "$SRC"/. "api-$API"/
          echo "${{ github.sha }}" > "api-$API/commit.txt"
          git add "api-$API"
          git commit -qm "logs api $API run ${{ github.run_number }}" || true
          for i in 1 2 3 4 5; do
            git push origin HEAD:ci-logs && break
            sleep $((i*3))
            git fetch --depth 20 origin ci-logs && git rebase origin/ci-logs || git rebase --abort || true
          done

      - name: Fail if the app crashed
        run: grep -q "^RUNNING.*relaunch RUNNING" ci-logs/api-${{ matrix.api }}/result.txt
